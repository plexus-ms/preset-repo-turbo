_subdirectory: template

_tasks:
  - "git init"
  - "mise trust"
  - "mise install"
  # The template states majors, never versions (§ 1 PLX-Updates); the two pins the toolchain
  # needs exact are written once at birth, so a repo starts at the newest release and its
  # update bot is the only writer from then on. Two accepted limits: corepack ignores the
  # three-day release age, and pnpm saves an exact version only without a range, so Biome
  # is born at its newest release whatever the major.
  - command: "mise exec -- npx corepack use pnpm@12"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "mise exec -- pnpm add --workspace-root --save-dev --save-exact @biomejs/biome"
    when: "{{ _copier_operation == 'copy' }}"

tenant:
  type: str
  help: "Tenant slug (URL-friendly)"
  placeholder: "acme-corp"

publishes_packages:
  type: bool
  help: "Does this repo publish npm packages from its trunk (changesets, OIDC trusted publishing, § 5 PLX-Delivery) instead of deploying apps from environment branches?"
  default: false

ci_strategy:
  type: str
  help: "Where the CI jobs run (§ 8 PLX-Delivery): github, the forge's runners; on-prem, container slots on runner hosts of the tenant's own for every job; hybrid, slots for the small and medium jobs and a throwaway cloud instance for each build and test"
  default: github
  choices:
    - github
    - on-prem
    - hybrid

ci_registry:
  type: str
  help: "Where the images a run builds and tests live before they are published (§ 8 PLX-Delivery): ghcr, the forge's registry; own, a registry on the tenant's object storage, which also holds Turbo's remote cache"
  choices:
    - ghcr
    - own
  default: "{{ 'ghcr' if ci_strategy == 'github' else 'own' }}"
  when: "{{ not publishes_packages }}"

ci_overlay:
  type: str
  help: "How a deploy reaches the app hosts (§ 8 PLX-Delivery): none, as the inventory names them; netbird, over the tenant's overlay, which a job on the forge's runners joins for its length"
  choices:
    - none
    - netbird
  default: none
  when: "{{ not publishes_packages }}"

alerts_email:
  type: str
  help: "Hybrid strategy: the address mailed when an instance misses its boot and is kept (empty: no mail); a fact, so an answer here and never a vault item"
  default: ""
  when: "{{ not publishes_packages and ci_strategy == 'hybrid' }}"

renovate_reviewers:
  type: str
  help: "GitHub logins the update bot requests a review from on the PRs that wait for a human, comma-separated (empty: none); a PR the bot merges itself asks nobody unless its checks fail"
  default: ""

update_max_age:
  type: int
  help: "The backstop of taking a Plexus version (§ 3 PLX-Updates), in days: this repo takes the newest version once the oldest one it has not taken is this old, and rests on the version it has until then; 0 takes every version as it is cut, and more than 30 is a deviation to own in PLEXUS.md"
  default: 30
  validator: "{% if update_max_age < 0 %}A number of days, zero or more{% endif %}"
